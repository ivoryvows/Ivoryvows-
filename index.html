<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IvoryVows | Wedding Invitation Boutique</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #FFF6F0 0%, #F8EDE4 100%);
            --card-bg: #FFFFFF;
            --primary-gold: #C5A059;
            --gold-hover: #B38F48;
            --text-dark: #2C2C2C;
            --text-muted: #6E6E6E;
            --border-color: #EFE0D5;
            --shadow: 0 10px 30px rgba(197, 160, 89, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-dark);
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        /* Sparkle Background Pattern */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(#C5A059 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.12;
            pointer-events: none;
            z-index: 1;
        }

        /* Header Layout matching reference */
        header {
            background: rgba(255, 246, 240, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            z-index: 1000;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-logo {
            height: 38px;
            width: auto;
            object-fit: contain;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lang-btn {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .menu-icon-btn {
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            color: var(--text-dark);
        }

        /* Main Wrapper */
        .main-container {
            padding: 110px 15px 40px 15px;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
            text-align: center;
        }

        /* Category Tabs Grid */
        .category-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 25px;
            background: #FFFFFF;
            padding: 12px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        .tab-btn {
            background: #FAF0EB;
            border: 1px solid transparent;
            padding: 10px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #C5A059 0%, #B38F48 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.3);
        }

        .instruction-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        /* Carousel Slider Layout (Reference style) */
        .carousel-container {
            position: relative;
            width: 100%;
            height: 420px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .carousel-track {
            display: flex;
            align-items: center;
            transition: transform 0.4s ease-in-out;
            width: 100%;
            position: relative;
            height: 100%;
            justify-content: center;
        }

        .carousel-card {
            position: absolute;
            width: 260px;
            height: 380px;
            background: #FFFFFF;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: all 0.4s ease-in-out;
            cursor: pointer;
        }

        /* Card Positioning for 3D Flow effect */
        .carousel-card.prev {
            transform: translateX(-160px) scale(0.85);
            opacity: 0.6;
            z-index: 1;
        }

        .carousel-card.active {
            transform: translateX(0) scale(1);
            opacity: 1;
            z-index: 3;
            box-shadow: 0 15px 35px rgba(197, 160, 89, 0.2);
        }

        .carousel-card.next {
            transform: translateX(160px) scale(0.85);
            opacity: 0.6;
            z-index: 1;
        }

        .carousel-card.hidden {
            display: none;
        }

        .card-media {
            width: 100%;
            height: 270px;
            position: relative;
            background: #f4f1ea;
        }

        .card-media img, .card-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Open Website Center Button on Media */
        .open-preview-btn {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(4px);
            cursor: pointer;
        }

        .card-info {
            padding: 15px;
            text-align: center;
        }

        .card-category-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .card-heading {
            font-family: 'Playfair Display', serif;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-dark);
        }

        /* Carousel Navigation Arrows */
        .carousel-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: white;
            border: 1px solid var(--border-color);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            color: var(--primary-gold);
            font-weight: bold;
        }

        .carousel-arrow.prev-arrow { left: 5px; }
        .carousel-arrow.next-arrow { right: 5px; }

        /* Dots Indicator */
        .dots-indicator {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 30px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #EFE0D5;
            transition: all 0.3s;
        }

        .dot.active {
            width: 20px;
            border-radius: 4px;
            background: var(--primary-gold);
        }

        /* View All Samples Button */
        .view-all-btn {
            background: #FFFFFF;
            border: 1px solid var(--primary-gold);
            color: var(--primary-gold);
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .view-all-btn:hover {
            background: var(--primary-gold);
            color: white;
        }

        /* Modal Popup */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: #FFFFFF;
            padding: 22px;
            border-radius: 18px;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            position: relative;
            text-align: center;
        }

        .modal-content h3 {
            font-family: 'Playfair Display', serif;
            margin-bottom: 10px;
        }

        .modal-instruction {
            font-size: 11px;
            color: var(--text-dark);
            background: #FFF6F0;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            text-align: left;
            line-height: 1.4;
        }

        .country-input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 12px;
            outline: none;
        }

        .close-modal {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .submit-order-btn {
            background-color: var(--primary-gold);
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 15px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 11px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Header matching reference layout -->
    <header>
        <img src="logo.PNG" alt="IvoryVows Logo" class="header-logo" onerror="this.style.display='none'; document.getElementById('fallback-logo-text').style.display='block';">
        <span id="fallback-logo-text" style="display:none; font-family:'Playfair Display',serif; font-weight:700; color:var(--primary-gold); font-size:18px;">IvoryVows</span>
        
        <div class="header-right">
            <div class="lang-btn">🌐 EN</div>
            <div class="menu-icon-btn" onclick="alert('Menu options can be placed here!')">☰</div>
        </div>
    </header>

    <div class="main-container">
        
        <!-- Category Selector Tabs -->
        <div class="category-tabs">
            <button class="tab-btn active" onclick="switchCategory('wedding-website')">Wedding Website</button>
            <button class="tab-btn" onclick="switchCategory('wedding-video')">Wedding Video</button>
            <button class="tab-btn" onclick="switchCategory('birthday-website')">Birthday Website</button>
            <button class="tab-btn" onclick="switchCategory('birthday-video')">Birthday Video</button>
        </div>

        <p class="instruction-text">Choose a celebration format, then drag through the real samples. Tap the centre card to play or open a website.</p>

        <!-- Carousel Slider Section -->
        <div class="carousel-container">
            <div class="carousel-arrow prev-arrow" onclick="prevCard()">❮</div>
            
            <div class="carousel-track" id="carouselTrack">
                <!-- Cards will be dynamically loaded based on category -->
            </div>

            <div class="carousel-arrow next-arrow" onclick="nextCard()">❯</div>
        </div>

        <!-- Dots Pagination -->
        <div class="dots-indicator" id="dotsContainer"></div>

        <!-- View All Samples Button -->
        <button class="view-all-btn" onclick="openOrderModal('All Samples Catalog')">
            View all samples →
        </button>

    </div>

    <!-- Order / Inquiry Modal -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeOrderModal()">&times;</span>
            <h3>Place Your Order</h3>
            <p style="font-size: 12px; color: var(--primary-gold); font-weight: 600; margin-bottom: 10px;" id="selectedProductText"></p>
            
            <div class="modal-instruction">
                1. Type your country below.<br>
                2. Click copy & open Instagram.<br>
                3. Paste the message in DM.
            </div>

            <input type="text" id="userCountry" class="country-input" placeholder="Enter your Country (e.g. UAE, UK, USA)">
            <button class="submit-order-btn" onclick="copyAndOpenInstagram()">Copy Message & Open Instagram</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 IvoryVows. All Rights Reserved.</p>
    </footer>

    <script>
        // Sample Data categorized
        const sampleData = {
            'wedding-website': [
                { title: "Arabic Envelop", type: "Wedding Website", img: "https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=600&q=80" },
                { title: "Heritage Palace", type: "Wedding Website", img: "https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=600&q=80" },
                { title: "Bosphorus Pearl", type: "Wedding Website", img: "https://images.unsplash.com/photo-1522673607200-164d1b6ce486?auto=format&fit=crop&w=600&q=80" },
                { title: "Château Blush", type: "Wedding Website", img: "https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=600&q=80" }
            ],
            'wedding-video': [
                { title: "Royal Gold Cinematic", type: "Wedding Video", img: "https://images.unsplash.com/photo-1583939003579-730e3918a45a?auto=format&fit=crop&w=600&q=80" },
                { title: "Floral Bloom Invite", type: "Wedding Video", img: "https://images.unsplash.com/photo-1545232979-fbf802c64838?auto=format&fit=crop&w=600&q=80" }
            ],
            'birthday-website': [
                { title: "Golden Sparkle Milestone", type: "Birthday Website", img: "https://images.unsplash.com/photo-1530103862676-de8c9debad1d?auto=format&fit=crop&w=600&q=80" },
                { title: "Little Prince Celebration", type: "Birthday Website", img: "https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&w=600&q=80" }
            ],
            'birthday-video': [
                { title: "Party Confetti Blast", type: "Birthday Video", img: "https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=600&q=80" }
            ]
        };

        let currentCategory = 'wedding-website';
        let currentIndex = 0;

        function switchCategory(category) {
            currentCategory = category;
            currentIndex = 0;
            
            // Update active tab styling
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            renderCarousel();
        }

        function renderCarousel() {
            const track = document.getElementById('carouselTrack');
            const dotsContainer = document.getElementById('dotsContainer');
            track.innerHTML = '';
            dotsContainer.innerHTML = '';

            const items = sampleData[currentCategory];

            items.forEach((item, index) => {
                // Create Card
                const card = document.createElement('div');
                card.className = 'carousel-card';
                
                if (index === currentIndex) {
                    card.classList.add('active');
                } else if (index === (currentIndex - 1 + items.length) % items.length) {
                    card.classList.add('prev');
                } else if (index === (currentIndex + 1) % items.length) {
                    card.classList.add('next');
                } else {
                    card.classList.add('hidden');
                }

                card.onclick = () => { currentIndex = index; renderCarousel(); };
                card.innerHTML = `
                    <div class="card-media">
                        <img src="${item.img}" alt="${item.title}">
                        <button class="open-preview-btn" onclick="event.stopPropagation(); openOrderModal('${item.title}')">
                            ▶ Open website
                        </button>
                    </div>
                    <div class="card-info">
                        <div class="card-category-label">${item.type}</div>
                        <div class="card-heading">${item.title}</div>
                    </div>
                `;
                track.appendChild(card);

                // Create Dot
                const dot = document.createElement('div');
                dot.className = index === currentIndex ? 'dot active' : 'dot';
                dot.onclick = () => { currentIndex = index; renderCarousel(); };
                dotsContainer.appendChild(dot);
            });
        }

        function nextCard() {
            const items = sampleData[currentCategory];
            currentIndex = (currentIndex + 1) % items.length;
            renderCarousel();
        }

        function prevCard() {
            const items = sampleData[currentCategory];
            currentIndex = (currentIndex - 1 + items.length) % items.length;
            renderCarousel();
        }

        // Modal Functions
        let currentProduct = "";
        function openOrderModal(productName) {
            currentProduct = productName;
            document.getElementById('selectedProductText').innerText = "Selected: " + productName;
            document.getElementById('userCountry').value = ""; 
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeOrderModal() {
            document.getElementById('orderModal').style.display = 'none';
        }

        function copyAndOpenInstagram() {
            let country = document.getElementById('userCountry').value.trim();
            if (country === "") {
                alert("Please enter your country first!");
                document.getElementById('userCountry').focus();
                return;
            }

            let instaUsername = "ivoryvows_invites"; 
            let textToCopy = `Hi, I want to order/check "${currentProduct}". My country is ${country}. Please send me details.`;

            navigator.clipboard.writeText(textToCopy).then(() => {
                alert("Message copied! Now open Instagram DM and paste it.");
            });

            setTimeout(() => {
                window.location.href = `https://www.instagram.com/${instaUsername}/`;
            }, 500);
            
            closeOrderModal();
        }

        // Initial Load
        renderCarousel();
    </script>
</body>
</html>
